# Generated by scripts/openmetadata_sync.py — do not hand-edit.
# Regenerate: python3 scripts/use_case_sync.py --use-case example-order-revenue-mart --stage openmetadata
#
# The MECHANICAL layer of the OpenMetadata projection: tables, descriptions, owners,
# dbt tests, and model-level lineage, all built by upstream's own dbt connector. This
# bridge does not re-derive any of it — see the module docstring of
# scripts/openmetadata_sync.py for why.
#
#   pip install 'openmetadata-ingestion[dbt]==1.13.3.0'
#   metadata ingest -c openmetadata/ingestion/dbt.yaml
#
# The enrichment layer — deep column lineage, glossary, facet tags, dlt provenance —
# is in ../bundle/ and is pushed by:
#
#   python3 scripts/openmetadata_sync.py --use-case example-order-revenue-mart --push
#
# `serviceName` is the OpenMetadata database service this use-case's warehouse is
# registered under. It is declared in openmetadata.yml; nothing in manifest.json knows it.

source:
  type: dbt
  serviceName: example_duckdb
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtManifestFilePath: skill-packs/dbt-skills/use-cases/example-order-revenue-mart/dbt_project/target/manifest.json
        dbtCatalogFilePath: skill-packs/dbt-skills/use-cases/example-order-revenue-mart/dbt_project/target/catalog.json
        dbtRunResultsFilePath: skill-packs/dbt-skills/use-cases/example-order-revenue-mart/dbt_project/target/run_results.json
      # False on purpose. dbt descriptions are already the source of truth for the
      # models this repository generates, but a catalog user may have curated a
      # description the repository has no record of; overwriting it on every ingest is
      # how a unidirectional pipeline turns into data loss.
      dbtUpdateDescriptions: false
      dbtUpdateOwners: false
      includeTags: true
      dbtClassificationName: dbtTags
      searchAcrossDatabases: false

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_SERVER_URL}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_AUTH_TOKEN}
