# What each conformed column MEANS. HAND-AUTHORED; nothing regenerates this file.
#
# Scaffolded by `column_annotations.py --use-case enhanza-analytics --propose`. Every value
# below is derived from a cast type, a name shape, or a declared accepted_values
# test — evidence, not a decision. Confirm each one. Then run:
#
#     python3 scripts/column_annotations.py --use-case enhanza-analytics
#
# role:       identifier | measure | dimension | timestamp | flag | text
# additivity: additive | semi_additive | non_additive   (measures only — rule 11)
# pii:        none | direct | quasi | indirect   (rule 17)
# unit:       currency | count | quantity | percent | duration | date | none
#
# A `domain:` block MUST name its source. An enum nobody can cite is invented
# (rule 5), and a wrong closed domain passes every test.

