  # ---------------------------------------------------------------------------------
  # Measures whose additivity is a decision, not a derivation (rule 11).
  #
  # `--propose` never proposes `additive`: it is the value a reader assumes, so
  # proposing it would remove the prompt to decide while adding nothing. These eleven
  # are the measures this project describes but does not classify, so each records the
  # call and the reason. A unit price is non-additive at every grain — summing prices
  # across rows produces a number with no referent — and the additive companion to use
  # instead is named in each case.
  # ---------------------------------------------------------------------------------

  Amount:
    # carried by 1 connector(s): fortnox
    # evidence: name contains an amount or quantity word
    # evidence: cast to float64/numeric
    # evidence: unit proposed as currency from the name
    # decision: a posted P&L amount is a flow: it sums across accounts, periods and tenants
    role: measure
    additivity: additive
    unit: currency
    pii: none
    definition: "Profit & Loss: Aggregation of Credit and Debit"   # harvested from the project's own schema.yml

  ContributionValue:
    # carried by 6 connector(s): favrit, fortnox, seventime, shopify, visma_eaccounting, visma_economic
    # evidence: cast to float64/string
    # evidence: unit proposed as currency from the name
    # decision: a per-line contribution value is a flow and sums to a period total
    role: measure
    additivity: additive
    unit: currency
    pii: none
    definition: "Sold value minus estimated price of the item. The item row value is used"   # harvested from the project's own schema.yml

  Net:
    # carried by 2 connector(s): fortnox, shopify
    # evidence: name contains an amount or quantity word
    # evidence: cast to float64
    # evidence: unit proposed as currency from the name
    # decision: a delivered sales value excluding VAT is a flow and sums across time
    role: measure
    additivity: additive
    unit: currency
    pii: none
    definition: "Sales value of delivered items excluding VAT"   # harvested from the project's own schema.yml

  NumberOfUnits:
    # carried by 1 connector(s): fortnox
    # evidence: cast to float64
    # evidence: unit proposed as quantity from the name
    # decision: a count of paid days or hours is a flow and sums across employees and periods
    role: measure
    additivity: additive
    unit: quantity
    pii: none
    definition: "Salary: Number of days, hours etc. the employee is paid for"   # harvested from the project's own schema.yml

  OrderedQuantity:
    # carried by 3 connector(s): favrit, fortnox, shopify
    # evidence: name contains an amount or quantity word
    # evidence: cast to float64
    # evidence: unit proposed as quantity from the name
    # decision: a line quantity is a flow and sums across lines and periods
    role: measure
    additivity: additive
    unit: quantity
    pii: none
    definition: "Line quantity ordered."   # harvested from the project's own schema.yml

  OrderedValue:
    # carried by 3 connector(s): favrit, fortnox, shopify
    # evidence: cast to float64
