    expected_concepts: [dim_customers, dim_suppliers, dim_accounts, dim_articles,
                        dim_financial_years, fact_invoices, fact_invoice_rows, fact_vouchers]

  - key: visma_net
    name: Visma.net
    kind: erp
    status: planned
    region: "NO"
    expected_concepts: [dim_customers, dim_suppliers, dim_accounts, dim_cost_centers,
                        dim_projects, dim_financial_years, fact_invoices, fact_vouchers]

  - key: poweroffice
    name: PowerOffice
    kind: erp
