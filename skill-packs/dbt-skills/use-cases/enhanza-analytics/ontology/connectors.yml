# Connector catalogue
# ===================
#
# Every source system Enhanza connects or intends to connect. This is the extension point:
# adding a connector to the platform starts with a row here, and everything downstream —
# the ontology extension, the topology, the dbt package scaffold — is generated from it.
#
# `status` is the honest part.
#
#   implemented  the connector has adapter models in the warehouse, and its ontology
#                extension is generated from the registry, the manifest, and the parsed
#                column lineage. Every class in it names a dbt model that exists.
#
#   planned      the connector is named and its kind is known, and nothing else is. Its
#                source tables, its column names, and which concepts it can actually supply
#                are unknown in this repository, so they are not written down. The generated
#                extension is a stub carrying [NEEDS INPUT]. Inventing a plausible Salesforce
#                schema here would produce an ontology that looks finished and maps to
#                nothing — rule 5 in .claude/rules/analytics-engineering-rules.md.
#
# `expected_concepts` on a planned connector is a *hypothesis* about scope, used to size the
# work and to generate the scaffold's TODO list. It is not an assertion that the connector
# supplies them, and the generator marks it as such.
#
# An `implemented` connector's `key` MUST match a key in
# `global_configs('all_available_sources')`; tests/test_ontology_generator.py fails on drift.

connectors:

  # ---- implemented: ERP / accounting -------------------------------------------------
  - key: fortnox
    name: Fortnox
    kind: erp
    status: implemented
    region: SE

  - key: tripletex
    name: Tripletex
    kind: erp
    status: implemented
    region: "NO"

  - key: visma_economic
    name: Visma e-conomic
    kind: erp
