name: shopify_bi_dim_articles_staging
table_reference:
  catalog: enhanza_sample
  schema: shopify_staging_demo
  table: shopify_bi_dim_articles
columns:
- name: Active
  type: TEXT
  is_calculated: false
  not_null: false
  properties:
    description: True when the parent product `status` is 'active'.
- name: ArticleId
  type: TEXT
  is_calculated: false
  not_null: true
  properties:
    description: Shopify variant id, cast to string. Primary key.
    dbt_tests: not_null,unique
    dbt_test_status: verified
  is_primary_key: true
- name: ArticleNumber
  type: TEXT
  is_calculated: false
  not_null: false
  properties:
    description: Variant SKU. Nullable — Shopify does not require one.
cached: false
properties:
  description: One row per Shopify product variant. Variant grain, not product grain,
    because an order line references a variant — a product-grain dimension would fan
    out when joined to fact_order_rows. Product attributes repeat across a product's
    variants.
  dbt_layer: staging
  dbt_unique_id: model.enhanza_shopify.shopify_bi_dim_articles_staging
  dbt_resource_type: model
primary_key: ArticleId
