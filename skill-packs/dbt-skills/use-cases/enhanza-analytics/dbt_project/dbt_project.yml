# The ERP/CRM BI project — a project by itself. Connectors live under packages/ as
# standalone dbt packages, composed by packages.yml; this root owns the unified layer
# (erp/), the marts (logic_bi/), the app and demo layers, the mechanism macros, and the
# registry. The macros stay here by construction: dbt Core resolves unqualified macro
# calls through the calling package and the root project only, never a sibling package.
name: 'enhanza_erp_bi'
version: '1.0.0'
config-version: 2
profile: 'enhanza_sample'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: [">=1.9.0", "<2.0.0"]

# ---------------------------------------------------------------------------------------
# Connector switches
# ---------------------------------------------------------------------------------------
# Enhanza is multi-tenant: one project builds every customer's warehouse, and each customer
# connects a different subset of sources. `is_<source>_enabled` is how a run says which.
#
# Every key here MUST have a matching entry in global_configs('all_available_sources') and
# vice versa — tests/test_enhanza_connector_registry.py enforces it. Declaring the defaults
# here rather than leaving them to `var('is_x_enabled', 'False')` call sites means a typo in
# a `--vars` override is visible in one place instead of silently disabling a connector.
#
# Enable per run, not here:
#   dbt build --vars '{"uid": "acme", "is_fortnox_enabled": true, "is_erp_enabled": true}'
# ---------------------------------------------------------------------------------------
vars:
  # `uid` is the tenant identifier that resolves every source schema (fortnox_api_<uid>).
  # Deliberately has no default: a run without it must fail loudly rather than build
  # against a schema named after nothing.

  is_erp_enabled: false          # gates the unified erp_bi and logic_bi layers
  is_favrit_enabled: false
  is_fortnox_enabled: false
  is_hubspot_enabled: false      # CRM. Source dataset does not exist yet — connector is `planned`

  # Contacts are gated separately, and both flags are required to build them. HubSpot
  # contacts are personal data of identifiable individuals (prospects and form-fills, not
  # customers of record) and rule 17 requires the masking/hashing/exclusion decision to be
  # made in staging before the table is read — a decision the data-protection owner has not
  # made. One flag for the whole package would make "turn HubSpot on" silently also mean
  # "materialise raw contact PII into the warehouse", and the person flipping it would have
  # no reason to know that. Two flags cannot make the decision, but they stop it being made
  # by accident.
  is_hubspot_contacts_enabled: false
  is_seventime_enabled: false
  is_shopify_enabled: false
  is_tempo_enabled: false
  is_tripletex_enabled: false
  is_upsales_enabled: false
  is_visma_eaccounting_enabled: false
  is_visma_economic_enabled: false
  is_xledger_enabled: false

  # Optional per-tenant overrides, empty by default.
  available_sources: []          # read by get_latest_source_timestamp()
  start_years: {}                # {org_id: 'YYYY-MM-DD'} floor, read by fortnox_start_year_filter()

# ---------------------------------------------------------------------------------------
# Layer configuration
# ---------------------------------------------------------------------------------------
# Tags mirror the layer and the owning connector so a connector can be built, tested, and
# rolled back in isolation:
#   dbt build --select tag:fortnox        # everything Fortnox contributes, all layers
#   dbt build --select tag:unified+       # the unified layer and everything downstream
#   dbt build --exclude tag:scaffold      # skip the starter placeholder models
#
# `+schema` is what makes those layers addressable. `model_alias()` strips the connector
# prefix, so `fortnox_bi_dim_accounts`, `tripletex_bi_dim_accounts`, `logic_bi_dim_accounts`
# and `erp_bi_dim_accounts` all alias to the bare relation `dim_accounts` — 38 aliases in
# this project are claimed by more than one model. That is intended: the dataset, not the
# table name, is what separates them. Without a `+schema` per directory dbt refuses to parse
# with more than a narrow subset of connectors enabled ("two resources with the database
# representation"), which is why `generate_schema_name` exists and had nothing to consume.
#
# The invariant: one model directory, one dataset. Verified by
# `scripts/connector_alignment_check.py`, which fails when a new connector introduces an
# alias collision *within* a dataset — the only kind that is a real defect.
# ---------------------------------------------------------------------------------------
models:
  enhanza_erp_bi:
    +materialized: view

    # Loose starter models left over from the initial scaffold. Not part of the Enhanza
    # DAG; tagged so a real build can exclude them. No +schema: they stay in target.schema.
    dim_customers_scaffold:
      +tags: ['scaffold']
    orders_mart_scaffold:
      +tags: ['scaffold']
    stg_sales_orders_scaffold:
      +tags: ['scaffold']

    app:
      +schema: app
      +tags: ['app']

    demo:
      +schema: demo
      +tags: ['demo']

    # The unified layer is user-facing: erp_bi_dim_accounts -> erp_bi.dim_accounts.
    # Per-connector staging and BI layers live in packages/<connector>/ and declare
    # their own +schema there.
    erp:
      +schema: erp_bi
      +tags: ['unified', 'erp']

    logic_bi:
      +schema: logic_bi
      +tags: ['logic', 'mart']

  # ------------------------------------------------------------------------------------
  # Tenancy gates for the connector packages — in the ROOT project, twice over. First,
  # doctrine: packages.yml decides what is installed (composition); these vars decide what
  # is enabled for a tenant (tenancy), and tenancy is the deployment's call, not the
  # package's. Second, mechanics: dbt renders jinja with CLI vars fully only in the root
  # dbt_project.yml — the same gate declared inside a package's own yml read its default
  # and silently disabled all 70 Fortnox BI models. The emitter's coverage gate (95% of
  # on-disk models must reach the manifest) is what caught it.
  # ------------------------------------------------------------------------------------
  enhanza_favrit:
    +enabled: "{{ var('is_favrit_enabled', false) | as_bool }}"
  enhanza_fortnox:
    +enabled: "{{ var('is_fortnox_enabled', false) | as_bool }}"
  enhanza_hubspot:
    +enabled: "{{ var('is_hubspot_enabled', false) | as_bool }}"
  enhanza_seventime:
    +enabled: "{{ var('is_seventime_enabled', false) | as_bool }}"
  enhanza_shopify:
    +enabled: "{{ var('is_shopify_enabled', false) | as_bool }}"
  enhanza_tempo:
    +enabled: "{{ var('is_tempo_enabled', false) | as_bool }}"
  enhanza_tripletex:
    +enabled: "{{ var('is_tripletex_enabled', false) | as_bool }}"
  enhanza_upsales:
    +enabled: "{{ var('is_upsales_enabled', false) | as_bool }}"
  enhanza_visma_eaccounting:
    +enabled: "{{ var('is_visma_eaccounting_enabled', false) | as_bool }}"
  enhanza_visma_economic:
    +enabled: "{{ var('is_visma_economic_enabled', false) | as_bool }}"
  enhanza_xledger:
    +enabled: "{{ var('is_xledger_enabled', false) | as_bool }}"
