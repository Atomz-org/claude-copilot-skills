version: 2

models:
  - name: shopify_bi_dim_customers
    description: >
      One row per Shopify customer — the source-aligned customer dimension Shopify users
      query directly. Pass-through of shopify_bi_dim_customers_staging with the column list
      enumerated so a new upstream Shopify field cannot surface here silently.
    columns:
      - name: CustomerId
        description: Shopify customer id. Primary key.
        data_tests:
          - unique
          - not_null

  - name: shopify_bi_fact_orders
    description: >
      One row per Shopify order, cancelled orders excluded, five-year window. Amounts are
      in the shop's own currency.
    columns:
      - name: OrderId
        description: Shopify order id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: CustomerId
        description: Owning customer. Nullable for guest checkout.
        data_tests:
          - relationships:
              to: ref('shopify_bi_dim_customers')
              field: CustomerId

  - name: shopify_bi_fact_order_rows
    description: >
      One row per line item on a non-cancelled Shopify order. Retains OrderRowId, which the
      unified erp_bi_fact_order_rows contract has no column for — this is the only layer a
      consumer can get a line-level key from.
    columns:
      - name: OrderRowId
        description: Shopify line item id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: OrderId
        description: Parent order.
        data_tests:
          - not_null
          - relationships:
              to: ref('shopify_bi_fact_orders')
              field: OrderId
      - name: ArticleId
        description: Shopify variant id. Nullable for custom line items.
        data_tests:
          - relationships:
              to: ref('shopify_bi_dim_articles')
              field: ArticleId

  - name: shopify_bi_dim_articles
    description: >
      One row per Shopify product variant. Variant grain so it joins to order rows without
      fanning out; product-level attributes repeat across a product's variants.
    columns:
      - name: ArticleId
        description: Shopify variant id. Primary key.
        data_tests:
          - unique
          - not_null
