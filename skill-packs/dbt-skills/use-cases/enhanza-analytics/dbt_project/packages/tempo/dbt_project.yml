# enhanza_tempo — the Tempo connector as a dbt package.
#
# Installed by one `- local: packages/tempo` line in the root packages.yml; enabled
# per tenant by the root-level `is_tempo_enabled` var. Mechanism macros (model_alias,
# auto_config, add_erp_fields, erp_union) resolve from the ROOT project — dbt Core never
# searches sibling packages for unqualified macros — so this package declares no macro
# dependency and carries only what it owns: its models, its sources, and any macro used
# solely here.
name: 'enhanza_tempo'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]

models:
  enhanza_tempo:
    +materialized: view
    +tags: ['tempo']
    +enabled: "{{ var('is_tempo_enabled', false) | as_bool }}"
    staging:
      +schema: tempo_staging
      +tags: ['staging']
