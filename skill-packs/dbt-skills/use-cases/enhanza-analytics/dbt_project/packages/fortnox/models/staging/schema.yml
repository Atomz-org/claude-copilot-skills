  - name: fortnox_erp_bi_fact_attendance_transactions
    description: >
      One row per row of `fortnox_api.attendance_transactions` — hours reported against a
      cause code, with the employee's cost centre and project filled in where the
      transaction states none of its own.

      Grain assumption, untested: `public.cause_codes` is joined on `Code` alone, without
      `OrgId`, and `fortnox_api.employees` on `(OrgId, EmployeeId)`. Neither is declared
      unique anywhere in this project, so a duplicate on either side multiplies the
      transaction and every `Hours` total silently doubles. No column of this model is a
      key, so the grain cannot be asserted with dbt's built-in tests, and `dbt_utils` —
      whose `unique_combination_of_columns` and `equal_rowcount` would — is not installed
      here.
