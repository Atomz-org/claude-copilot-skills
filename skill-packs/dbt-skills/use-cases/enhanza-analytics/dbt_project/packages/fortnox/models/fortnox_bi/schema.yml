version: 2

models:
  - name: fortnox_bi_dim_accounts
    meta:  # generated: lightdash_context_sync
      joins:
        - join: fortnox_bi_dim_financial_years
          sql_on: ${fortnox_bi_dim_accounts.FinancialYearId} = ${fortnox_bi_dim_financial_years.FinancialYearId}
          type: left
          relationship: many-to-one
      primary_key: AccountId
    description: 'List of BAS accounts used in Fortnox, only Active'
    columns:
      - name: Number
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "BAS account number, consists of four digits, e.g., 1234"
        data_type: INTEGER
        description: 'BAS account number, consists of four digits, e.g., 1234'
      - name: AccountName
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "The name of the account in the chart of accounts"
        data_type: STRING
        description: 'The name of the account in the chart of accounts'
      - name: BalanceBroughtForward
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Balance sheet at the beginning of the financial year Additivity: semi_additive \u2014 do not SUM without checking the aggregation contract."
        data_type: FLOAT
        description: 'Balance sheet at the beginning of the financial year'
      - name: BalanceCarriedForward
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Final current balance for the financial year Additivity: semi_additive \u2014 do not SUM without checking the aggregation contract."
        data_type: FLOAT
        description: 'Final current balance for the financial year'
      - name: CostCenterId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Foreign key to dim_cost_centers"
        data_type: STRING
        description: 'Foreign key to dim_cost_centers'
      - name: ProjectId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Foreign key to dim_projects"
        data_type: STRING
        description: 'Foreign key to dim_projects'
      - name: AccountClassId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "First account digit, e.g., 1xxx"
        data_type: STRING
        description: "First account digit, e.g., 1xxx"
      - name: AccountClass
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "BAS account class defined by first account digit"
        data_type: STRING
        description: "BAS account class defined by the first account digit"
      - name: MainAccountId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "First two digits, e.g., 12xx"
        data_type: STRING
        description: 'First two digits, e.g., 12xx'
      - name: MainAccount
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "BAS main account defined by first two account digits"
        data_type: STRING
        description: 'BAS main account defined by first two account digits'
      - name: SubAccountId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "First three digits, e.g., 123x"
        data_type: STRING
        description: 'First three digits, e.g., 123x'
      - name: SubAccount
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "BAS sub-account defined by first three account digits"
        data_type: STRING
        description: 'BAS sub-account defined by first three account digits'
      - name: AccountId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Unique Account identifier used as a primary key"
        data_type: STRING
        description: 'Unique Account identifier used as a primary key'
        data_tests:
          - unique
          - not_null
      - name: FinancialYearId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Foreign key to dim_financial_years"
        data_type: STRING
        description: 'Foreign key to dim_financial_years'
        data_tests:
          - relationships:
              to: ref('fortnox_bi_dim_financial_years')
              field: FinancialYearId
  - name: fortnox_bi_dim_articles
    meta:  # generated: lightdash_context_sync
      joins:
        - join: fortnox_bi_dim_company
          sql_on: ${fortnox_bi_dim_articles.OrgId} = ${fortnox_bi_dim_company.OrgId}
          type: left
          relationship: many-to-one
      primary_key: ArticleId
    description: "Datailed information on sold articles (items)"
    columns:
      - name: ArticleId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Unique Article identifier used as a primary key"
        description: 'Unique Article identifier for the workspace'
        data_tests:
          - unique
          - not_null
      - name: OrgId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Unique identifier of your organisation that can be found in the Enhanza app"
        data_tests:
          - relationships:
              to: ref('fortnox_bi_dim_company')
              field: OrgId
      - name: QuantityInStock
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Current amount in stock from fortnox_bi.fact_stockbalance Additivity: semi_additive \u2014 do not SUM without checking the aggregation contract."
        description: "Current amount in stock from fortnox_bi.fact_stockbalance"
      - name: ReservedQuantity
        description: "Difference between total amount in stock and available stock"
      - name: isBundleSubItem
        description: "TRUE if the article is part of a bundle"
  - name: fortnox_bi_dim_assets_types
