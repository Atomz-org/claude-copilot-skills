        description: "Unique identifier of assets types"
        data_tests:
          - unique
          - not_null
      - name: AssetType
        description: "Type of the asset"
        data_tests:
          - not_null
      - name: AccountAsset
        description: "The general ledger account where the asset’s acquisition value is recorded"
      - name: AccountDepreciation
        description: "The account used to record depreciation expenses for this asset"
      - name: AccountRevaluation
        description: "The account used if the asset is revalued (increase/decrease in book value)"
      - name: AccountSaleLoss
        description: "Account for recording losses if the asset is sold below book value"
      - name: AccountSaleWin
        description: "Account for recording gains if the asset is sold above book value"
      - name: AccountValueLoss
        description: "Account used when the asset’s value is impaired or written down"
      - name: AccountWriteDown
        description: "The account for reducing the asset’s book value"
      - name: AccountWriteDownAck
        description: "The account used to acknowledge or finalize a previous write-down of an asset"
      - name: AssetTypeUrl
        description: "A link to additional documentation or reference related to this asset type"
      - name: Description
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Text description of the asset type"
        description: "Text description of the asset type"
      - name: InUse
        description: "Boolean indicating whether this asset type is actively used in the system"
      - name: Notes
        description: "Additional notes for internal reference"
      - name: Number
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "BAS account number, consists of four digits, e.g., 1234"
        description: "BAS account number"
      - name: OrgId
        meta:  # generated: lightdash_context_sync
          dimension:
            ai_hint: "Unique identifier of your organisation that can be found in the Enhanza app"
        description: "Unique identifier of your organisation that can be found in the Enhanza app"
        data_tests:
          - relationships:
