version: 2

# [NEEDS INPUT] — every model below is a scaffold. No `hubspot_api_<uid>` dataset exists
# yet (see ../sources.yml), so the grain and the primary key of each entity are unknown.
#
# There is no `columns:` block here, deliberately. A `[NEEDS INPUT] primary key` column
# carrying `unique` and `not_null` is not a placeholder — it is an assertion that a column
# by that literal name exists, and dbt runs it: the moment `is_hubspot_enabled` is true
# every one of these tests fails on a column no model outputs. It also leaves the
# repository, because `wren_context_sync.py` reads the tested key out of the manifest and
# publishes it as the model's `primary_key`, so an agent joining on it gets a name that
# resolves to nothing.
#
# Rule 5 forbids inventing the real names, and rule 28 forbids merging a model without
# tests on its key. Both are satisfied by the connector being `planned` in
# ontology/connectors.yml rather than by a test that cannot pass: the unknown stays
# unknown, in prose, where nothing executes it.
#
# To finish a model: state its grain in `description`, then add the real key column with
# `tests: [unique, not_null]` — and promote the connector to `implemented` once every
# model here has one.

