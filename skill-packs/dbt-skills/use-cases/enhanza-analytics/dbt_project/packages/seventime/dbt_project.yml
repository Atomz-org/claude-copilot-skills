# enhanza_seventime — the SevenTime connector as a dbt package.
#
# Installed by one `- local: packages/seventime` line in the root packages.yml; enabled
# per tenant by the root-level `is_seventime_enabled` var. Mechanism macros (model_alias,
# auto_config, add_erp_fields, erp_union) resolve from the ROOT project — dbt Core never
# searches sibling packages for unqualified macros — so this package declares no macro
# dependency and carries only what it owns: its models, its sources, and any macro used
# solely here.
name: 'enhanza_seventime'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]

models:
  enhanza_seventime:
    +materialized: view
    +tags: ['seventime']
    +enabled: "{{ var('is_seventime_enabled', false) | as_bool }}"
    staging:
      +schema: seventime_staging
      +tags: ['staging']
