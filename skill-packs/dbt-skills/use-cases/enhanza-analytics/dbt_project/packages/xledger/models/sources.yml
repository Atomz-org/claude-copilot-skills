version: 2

sources:
  - name: xledger_api
    description: 'Xledger raw data'
    database: "{{ target.project | default(target.database) }}"
    schema: xledger_api_{{ var('uid') }}
    tables:
      - name: accounts
      - name: object_values
      - name: recent_transactions
      - name: transactions

