  # Shopify is the first source in this file to declare freshness. Every other block
  # predates the rule and is an undocumented SLA; this one is not. See CONNECTORS.md.
  # [NEEDS INPUT] `loaded_at_field` assumes the loader stamps `_loaded_at`. Confirm the
  # actual column against the landed schema — a wrong name makes `dbt source freshness`
  # error rather than silently pass, which is the safe direction, but it still blocks.
  # [NEEDS INPUT] warn/error thresholds below are placeholders pending the sync cadence.
  - name: shopify_api
    description: 'Shopify raw data'
    database: "{{ target.project | default(target.database) }}"
    schema: shopify_api_{{ var('uid') }}
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: customers
      - name: orders
      - name: order_lines
      - name: products
