        data_type: STRING
        constraints:
          - type: foreign_key
            to: ref('logic_bi_dim_articles')
            to_columns: [ArticleId]
            warn_unenforced: False
            warn_unsupported: False
      - name: OpeningQty
        data_type: FLOAT
        description: 'Available quantity at the beginning of the period'
      - name: SoldQty
        data_type: FLOAT
        description: 'Number of items sold during the period'
      - name: ReceivedQty
        data_type: FLOAT
        description: 'Number of items received from suppliers during the period'
      - name: StockTakingQty
        data_type: FLOAT
        description: 'Number of items dismissed during the period'
      - name: TotalPeriodChangeQty
        data_type: FLOAT
        description: 'Difference between opening and closing balance'
      - name: ClosingQty
        data_type: FLOAT
        description: 'Available quantity at the end of the period'
      - name: OpeningValue
        data_type: FLOAT
        description: 'Available value at the beginning of the period'
      - name: SoldValue
        data_type: FLOAT
        description: 'Value of items sold during the period'
      - name: ReceivedValue
        data_type: FLOAT
        description: 'Value of items received from suppliers during the period'
      - name: StockTakingValue
        data_type: FLOAT
        description: 'Value of items dismissed during the period'
      - name: TotalPeriodChangeValue
        data_type: FLOAT
        description: 'Difference between opening and closing balance'
      - name: ClosingValue
        data_type: FLOAT
        description: 'Available stock value at the end of the period'
      - name: OrgId
        data_type: STRING
        constraints:
          - type: foreign_key
            to: ref('logic_bi_dim_organisations')
            to_columns: [OrgId]
            warn_unenforced: False
            warn_unsupported: False
        data_tests:
          - not_null
      - name: DataSource
        data_type: STRING
        description: 'Name of ERP system where the data came from'
      - name: DefaultCurrency
        data_type: STRING
        description: 'Default currency based on the connected ERP system(s)' 