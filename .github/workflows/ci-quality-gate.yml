name: CI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -q pytest pytest-xdist sqlglot

      - name: Activate stack from shared packs
        run: |
          chmod +x scripts/activate_skill_stack.sh
          ./scripts/activate_skill_stack.sh dbt-skills wren-skills

      # Node is only needed so skill_map_scan.py can resolve its pinned CLI
      # (npx -y @skill-map/cli@<PINNED_VERSION>); the scan itself is
      # deterministic and offline -- see the runner's docstring.
      - name: Set up Node for skill-map
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Blocking harness-hygiene gate over the activated tree. The budget of 1
      # tolerates exactly the known senior-analytics-engineer agent/skill
      # name-collision (the documented compat alias); any NEW name-collision
      # or frontmatter-parse-error fails the PR. Drop the budget to 0 if the
      # alias is ever retired. Exit 3 means the CLI could not be resolved:
      # per the runner's contract that is a recorded skip, not a red build.
      - name: Skill-map hygiene gate (deterministic)
        run: |
          set +e
          python scripts/skill_map_scan.py --check --max-errors 1 --summary
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::warning::skill-map CLI unavailable on this runner; hygiene gate skipped."
            exit 0
          fi
          exit "$status"

      - name: Apply readiness label for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number || github.run_id }}"
          if gh pr edit "$pr_number" --repo "${{ github.repository }}" --add-label "status: ready" --remove-label "status: in-review"; then
            echo "Applied readiness label to PR #$pr_number"
          else
            echo "Warning: unable to apply readiness labels to PR #$pr_number. The workflow will continue without labels."
          fi

      - name: Run Python tests
        run: python -m pytest -q

      - name: Report final PR label state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number || github.run_id }}"
          echo "Current labels for PR #$pr_number:"
          gh pr view "$pr_number" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' || true

      - name: Validate shell scripts
        run: |
          bash -n scripts/activate_skill_stack.sh
          bash -n .claude/commands/git-standard.sh
          bash -n .claude/commands/update-memory.sh
          bash -n .claude/commands/lint-and-graph.sh
          bash -n .claude/hooks/block-dangerous-git.sh
          bash -n scripts/marketplace_portability_check.sh
          test -f .claude/commands/skills-index.md
          test -f .claude/commands/setup-git-guardrails.md
          test -f .claude/commands/marketplace-portability.md
          test -f .claude/skills/git-guardrails-claude-code/SKILL.md
          test -f .claude/skills/marketplace-portability-patterns/SKILL.md

      - name: Run portability checks
        run: |
          chmod +x scripts/marketplace_portability_check.sh
          ./scripts/marketplace_portability_check.sh

      - name: Assert guardrail blocks dangerous git command
        run: |
          set +e
          output_file="$(mktemp)"
          echo '{"tool_input":{"command":"git push origin main"}}' | .claude/hooks/block-dangerous-git.sh >"${output_file}" 2>&1
          exit_code=$?
          grep -q "BLOCKED" "${output_file}"
          test "${exit_code}" -eq 2

      - name: Validate workflow files
        run: |
          test -f .github/workflows/claude-code-review.yml
          test -f .github/workflows/pr-issue-auto-close.yml
          test -f .github/workflows/smart-sync.yml
          test -f .github/workflows/ci-quality-gate.yml
          test -f .github/workflows/pr-decision-diagram.yml
