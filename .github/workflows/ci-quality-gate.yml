name: CI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -q pytest

      - name: Activate stack from shared packs
        run: |
          chmod +x scripts/activate_skill_stack.sh
          ./scripts/activate_skill_stack.sh dbt-skills

      - name: Apply readiness label for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number || github.run_id }}" --repo "${{ github.repository }}" --add-label "status: ready" --remove-label "status: in-review" || true

      - name: Run Python tests
        run: pytest -q

      - name: Validate shell scripts
        run: |
          bash -n scripts/activate_skill_stack.sh
          bash -n .claude/commands/git-standard.sh
          bash -n .claude/commands/update-memory.sh
          bash -n .claude/commands/lint-and-graph.sh
          bash -n .claude/hooks/block-dangerous-git.sh
          bash -n scripts/marketplace_portability_check.sh
          test -f .claude/commands/skills-index.md
          test -f .claude/commands/setup-git-guardrails.md
          test -f .claude/commands/marketplace-portability.md
          test -f .claude/skills/git-guardrails-claude-code/SKILL.md
          test -f .claude/skills/marketplace-portability-patterns/SKILL.md

      - name: Run portability checks
        run: |
          chmod +x scripts/marketplace_portability_check.sh
          ./scripts/marketplace_portability_check.sh

      - name: Assert guardrail blocks dangerous git command
        run: |
          set +e
          output_file="$(mktemp)"
          echo '{"tool_input":{"command":"git push origin main"}}' | .claude/hooks/block-dangerous-git.sh >"${output_file}" 2>&1
          exit_code=$?
          grep -q "BLOCKED" "${output_file}"
          test "${exit_code}" -eq 2

      - name: Validate workflow files
        run: |
          test -f .github/workflows/claude-code-review.yml
          test -f .github/workflows/pr-issue-auto-close.yml
          test -f .github/workflows/smart-sync.yml
          test -f .github/workflows/ci-quality-gate.yml
