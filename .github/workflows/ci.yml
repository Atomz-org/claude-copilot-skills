name: Repository Baseline

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Resolves every external/ pin on every run, so an unpushed or rewritten
          # submodule SHA fails here instead of on the next fresh clone.
          #
          # `recursive: false` and every submodule marked `shallow = true` in
          # .gitmodules, because external/OpenMetadata is 403 MB at depth 1 and this
          # job runs on every push. scripts/sync_submodules.py --check verifies the
          # pins agree once they are here.
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify scaffold files
        run: |
          test -f .claude/memory.md
          test -f .claude/commands/skills-index.md
          test -f .github/copilot-instructions.md
          test -f docs/WAY_OF_WORKING.md
          test -f skill-packs/github-skills/.claude/skills/git-flow-branch-planner/SKILL.md
          test -f skill-packs/github-skills/.claude/skills/github-pr-merge-ceremony/SKILL.md
          test -f skill-packs/github-skills/.claude/skills/setup-pre-commit-hooks/SKILL.md
          test -f skill-packs/github-skills/.claude/skills/resolve-merge-conflicts/SKILL.md
          test -f skill-packs/github-skills/.claude/skills/documentation-writer-diataxis/SKILL.md
          test -f skill-packs/github-skills/.claude/skills/git-guardrails-claude-code/SKILL.md
          test -f skill-packs/github-skills/.claude/hooks/block-dangerous-git.sh
          test -f skill-packs/github-skills/.claude-plugin/plugin.json
          test -f skill-packs/dbt-skills/.claude-plugin/plugin.json
          test -f src/ai-core/rtk-setup.ts
          test -f src/ai-core/graph-manager.ts
          test -f src/ai-core/memory-store.ts
          test -d skill-packs/dbt-skills/references
          test -d skill-packs/dbt-skills/templates

      - name: Validate shell scripts
        run: |
          bash -n scripts/activate_skill_stack.sh
          bash -n .claude/commands/git-standard.sh
          bash -n .claude/commands/update-memory.sh
          bash -n .claude/commands/lint-and-graph.sh
          bash -n .claude/commands/infra/git-standard.sh
          bash -n .claude/commands/infra/update-memory.sh
          bash -n .claude/commands/infra/lint-and-graph.sh
          bash -n skill-packs/github-skills/.claude/hooks/block-dangerous-git.sh
          bash -n scripts/marketplace_portability_check.sh

      - name: Run portability checks
        run: |
          chmod +x scripts/marketplace_portability_check.sh
          ./scripts/marketplace_portability_check.sh

      - name: Sync active stack from skill packs
        run: |
          chmod +x scripts/activate_skill_stack.sh
          ./scripts/activate_skill_stack.sh dbt-skills wren-skills lightdash-skills openmetadata-skills

      # .claude/, references/, and templates/ are generated from skill-packs/. If activation
      # changes a tracked file, someone edited a generated copy instead of its pack source
      # and the edit would be silently reverted on the next activation.
      - name: Assert activation produces no drift
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Activation changed tracked files. Edit the pack source under skill-packs/, then re-run ./scripts/activate_skill_stack.sh dbt-skills wren-skills lightdash-skills openmetadata-skills and commit the result."
            exit 1
          fi

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist sqlglot

      - name: Run Python tests
        run: |
          python -m pytest -q
