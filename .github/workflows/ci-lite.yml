name: CI Lite

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  test-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest sqlglot

      - name: Activate stack from shared packs
        run: |
          chmod +x scripts/activate_skill_stack.sh
          ./scripts/activate_skill_stack.sh dbt-skills

      - name: Validate guardrail hook
        run: |
          test -f .claude/hooks/block-dangerous-git.sh
          bash -n .claude/hooks/block-dangerous-git.sh

      - name: Run portability checks
        run: |
          chmod +x scripts/marketplace_portability_check.sh
          ./scripts/marketplace_portability_check.sh

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run context sync
        run: |
          chmod +x scripts/sync_context.sh
          ./scripts/sync_context.sh "ci-lite validation"

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lite-context
          path: |
            .claude/agentmemory.json
            .claude/graph-state.json
            .claude/checkpoints/*.json
          if-no-files-found: warn
