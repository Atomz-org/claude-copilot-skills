name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply review labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number || github.run_id }}"
          if gh pr edit "$pr_number" --repo "${{ github.repository }}" --add-label "status: in-review" --remove-label "status: ready" --add-label "P2"; then
            echo "Applied review labels to PR #$pr_number"
          else
            echo "Warning: unable to apply review labels to PR #$pr_number. The workflow will continue without labels."
          fi

      - name: Apply contextual labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number || github.run_id }}"
          labels=()

          pr_title="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json title --jq '.title' 2>/dev/null || true)"
          if [[ "$pr_title" =~ ^chore\(deps\):\ bump ]] || [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            labels+=("dependencies")
          fi

          changed_files="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json files --jq '.files[].path' 2>/dev/null || true)"
          if printf '%s\n' "$changed_files" | grep -Eq '^\.github/workflows/'; then
            labels+=("github_actions")
          fi

          if (( ${#labels[@]} == 0 )); then
            echo "No contextual labels matched for PR #$pr_number"
            exit 0
          fi

          for label in "${labels[@]}"; do
            if gh pr edit "$pr_number" --repo "${{ github.repository }}" --add-label "$label"; then
              echo "Applied contextual label '$label' to PR #$pr_number"
            else
              echo "Warning: unable to apply contextual label '$label' to PR #$pr_number"
            fi
          done

      - name: Summarize PR context for Claude review
        run: |
          echo "Claude review scaffold ready for PR ${{ github.event.pull_request.number || github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.head_ref || github.ref_name }}"
          echo "Automation summary: review label attempt completed, workflow is ready for Claude-assisted analysis"

      - name: Report final PR label state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="${{ github.event.pull_request.number || github.run_id }}"
          echo "Current labels for PR #$pr_number:"
          gh pr view "$pr_number" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' || true
