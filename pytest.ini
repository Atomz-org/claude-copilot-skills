[pytest]
# Bare `pytest` must mean THIS repository's suite. Without testpaths, collection
# recurses into external/WrenAI — a submodule that ships its own test tree needing
# its own dev dependencies (pyarrow, duckdb, orjson, wren_core) — and into
# scripts/test_coverage_reporter.py, a dbt coverage CLI whose filename merely
# matches the test glob. CI's baseline job runs bare `python -m pytest -q`, which
# is exactly how the submodule's tests ended up failing this repository's gate.
# Explicit path arguments still override this, so `pytest tests/test_x.py` and
# scoped runs behave unchanged.
testpaths = tests
norecursedirs = external .venv* node_modules dbt_packages target
# _pytest_parallel turns on pytest-xdist when it is installed and does nothing when
# it is not. Naming the plugin is always safe; `-n auto` here would not be — it makes
# bare `pytest` fail with "unrecognized arguments" wherever xdist is absent, which is
# the one thing the comment above says must keep working. See _pytest_parallel.py.
addopts = -p _pytest_parallel
